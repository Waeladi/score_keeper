name: Score Android Deploy to Play Store

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Play track'
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      status:
        description: 'Release status (completed = goes live; inProgress = staged rollout; draft = review in Play Console first)'
        type: choice
        options: [completed, inProgress, draft]
        default: completed
      rollout:
        description: 'Staged rollout fraction, used only with inProgress (e.g. 0.2 = 20%)'
        type: string
        default: '0.2'

jobs:
  build_and_deploy:
    name: Build & Deploy AAB to Play Store
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # full history: build number = commit count

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.38.4'

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Flutter pub get
      run: flutter pub get

    - name: Decode Keystore & Create Properties
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEYSTORE_PATH_ON_RUNNER: /home/runner/upload-keystore.jks
      run: |
        echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH_ON_RUNNER"
        printf "%s\n" \
          "storePassword=$STORE_PASSWORD" \
          "keyPassword=$KEY_PASSWORD" \
          "keyAlias=$KEY_ALIAS" \
          "storeFile=$KEYSTORE_PATH_ON_RUNNER" > android/key.properties

    - name: Set Build Number
      id: build_number
      run: echo "COUNT=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

    - name: Build release AAB
      run: flutter build appbundle --release --build-number=${{ steps.build_number.outputs.COUNT }}

    - name: Save AAB as artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-aab-${{ steps.build_number.outputs.COUNT }}
        path: build/app/outputs/bundle/release/*.aab

    - name: Upload AAB to Google Play
      uses: r0adkll/upload-google-play@v1
      with:
        serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
        packageName: com.waelapps.score_keeper
        releaseFiles: build/app/outputs/bundle/release/*.aab
        track: ${{ inputs.track }}
        status: ${{ inputs.status }}
        userFraction: ${{ inputs.status == 'inProgress' && inputs.rollout || '' }}
        whatsNewDirectory: distribution/whatsnew
        mappingFile: build/app/outputs/mapping/release/mapping.txt
